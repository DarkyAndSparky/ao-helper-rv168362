//===========================================================================
// debug global binds (directly runs global commands)
//===========================================================================

globalbind toggle_render_debug_view 'CTRL' + 'SHIFT' + 'V'
globalbind toggle_render_post_filter 'CTRL' + 'SHIFT' + 'L'
globalbind toggle_fog 'CTRL' + 'SHIFT' + 'F'
globalbind toggle_pathfinding 'CTRL' + 'SHIFT' + 'P'
globalbind toggle_font_cache 'CTRL' + 'SHIFT' + 'H'
globalbind toggle_debug_info 'CTRL' + 'SHIFT' + 'D'
globalbind kill_all 'CTRL' + 'SHIFT' + 'K'
globalbind reset_timer 'CTRL' + 'SHIFT' + 'T'

globalbind kill 'CTRL' + 'K'
globalbind revive 'CTRL' + 'R'
globalbind save 'CTRL' + 'S'
globalbind complete_quests 'CTRL' + 'Q'

//globalbind make_debug_screenshot 'SYSRQ'

globalbind show_collision 'CTRL' + 'SHIFT' + 'G'


//===========================================================================
// common section (always active)
//===========================================================================

commonbindsection

bind toggle_debug_console '`'

bind dump_memory_stats 'CTRL' + 'SHIFT' + 'M'
//bind restart_ui 'CTRL' + 'SHIFT' + 'R'


